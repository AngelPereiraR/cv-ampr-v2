<app-navbar-general></app-navbar-general>

<main *transloco="let t; prefix: 'projects'">
  <section class="p-10 py-32 xl:px-20 2xl:px-52 bg-green-200">
    <div>
      <header class="flex flex-col justify-between items-center">
        <h1 class="text-lg font-bold text-green-600 pb-3 lg:pb-0">Portfolio</h1>
        <h2 class="text-5xl 2xl:text-7xl font-bold pb-3 lg:pb-0">
          {{ t("projects-title") | transloco }}
        </h2>
      </header>

      <div
        class="flex flex-wrap justify-center gap-3 mt-10"
        *ngIf="availableTechnologies.length > 0"
      >
        <button
          *ngFor="let tech of availableTechnologies"
          (click)="toggleTechnology(tech)"
          [class.bg-green-600]="selectedTechnologies.includes(tech)"
          [class.text-white]="selectedTechnologies.includes(tech)"
          [class.border-green-600]="selectedTechnologies.includes(tech)"
          [class.hover:bg-black]="!selectedTechnologies.includes(tech)"
          [class.hover:text-white]="!selectedTechnologies.includes(tech)"
          class="rounded-2xl px-4 py-2 border-2 border-black font-medium transition-all duration-500 cursor-pointer"
        >
          {{ tech }}
        </button>
        <button
          *ngIf="selectedTechnologies.length > 0"
          (click)="clearFilters()"
          class="rounded-2xl px-4 py-2 border-2 border-black font-medium transition-all duration-500 cursor-pointer hover:bg-black hover:text-white flex items-center gap-1"
        >
          <span class="material-icons text-base" style="vertical-align: middle">close</span>
          {{ t("clear-filters") }}
        </button>
      </div>

      <div
        *ngIf="filteredProjects.length === 0"
        class="mt-10 text-center text-gray-500"
      >
        {{ t("no-projects-found") }}
      </div>

      <div
        class="mt-10 grid grid-flow-row grid-cols-1 xl:grid-cols-2"
        *ngIf="filteredProjects.length > 0"
      >
        <article
          *ngFor="let project of filteredProjects"
          class="m-5 flex flex-col justify-center items-center"
        >
          <img
            class="h-60 xl:h-96 rounded-xl hover:scale-105 transition-all duration-500"
            [src]="project.images[0]"
            [alt]="project.name"
          />
          <div class="flex flex-row my-3 flex-wrap justify-center">
            <p
              *ngFor="let tech of project.technologies"
              class="rounded-2xl mx-2 p-2 border-2 border-black font-medium hover:scale-110 hover:text-white hover:bg-black transition-all duration-500"
            >
              {{ tech }}
            </p>
          </div>
          <h3 class="text-3xl font-bold">
            <a
              [href]="'projects/' + project.id"
              class="hover:text-green-600 transition-all duration-500"
            >
              {{ project.name }}
              <span
                class="material-icons px-2"
                style="
                  transform: rotate(45deg);
                  display: inline-block;
                  vertical-align: middle;
                "
                >arrow_upward</span
              >
            </a>
          </h3>
        </article>
      </div>
    </div>
  </section>
</main>

<a
  href="#home"
  class="fixed bottom-16 right-4 lg:right-10 bg-blue-600 text-white py-4 px-5 rounded-lg z-50"
  title="Ir hacia arriba"
>
  <span class="material-icons" style="vertical-align: middle"
    >arrow_upward</span
  >
</a>
