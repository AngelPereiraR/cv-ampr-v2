<section
  class="py-20 px-10 xl:p-20 2xl:px-52"
  *transloco="let t; prefix: 'services'"
>
  <header class="grid grid-flow-row lg:grid-flow-col">
    <div class="grid grid-flow-row mr-20">
      <h1
        class="text-lg font-bold text-green-600 pb-3 lg:pb-0 tracking-wide leading-6"
      >
        {{ t("services") | transloco }}
      </h1>
      <h2 class="text-5xl 2xl:text-7xl font-bold pb-3 lg:pb-0 tracking-wide">
        {{ t("specialties") | transloco }}
      </h2>
    </div>
  </header>
  <div class="grid grid-flow-row lg:grid-flow-col my-10">
    <div
      class="grid-cols-1 mx-5 my-3 lg:my-0 lg:mx-2 p-10 font-medium text-black hover:text-green-600 bg-gray-300 hover:bg-white rounded-xl hover:shadow-2xl shadow-gray-700 hover:scale-110 transition-all duration-500 cursor-pointer"
      (click)="goToProjects('backend')"
    >
      <span
        class="material-icons h-12 w-12 p-2 mb-5 bg-green-400 rounded-xl text-black text-3xl flex items-center justify-center"
        >dns</span
      >
      <h3>Backend</h3>
    </div>
    <div
      class="grid-cols-1 mx-5 my-3 lg:my-0 lg:mx-2 p-10 font-medium text-black hover:text-green-600 bg-gray-300 hover:bg-white rounded-xl hover:shadow-2xl shadow-gray-700 hover:scale-110 transition-all duration-500 cursor-pointer"
      (click)="goToProjects('frontend')"
    >
      <span
        class="material-icons h-12 w-12 p-2 mb-5 bg-green-400 rounded-xl text-black text-3xl flex items-center justify-center"
        >devices</span
      >
      <div>Frontend</div>
    </div>
    <div
      class="grid-cols-1 mx-5 my-3 lg:my-0 lg:mx-2 p-10 font-medium text-black hover:text-green-600 bg-gray-300 hover:bg-white rounded-xl hover:shadow-2xl shadow-gray-700 hover:scale-110 transition-all duration-500 cursor-pointer"
      (click)="goToProjects('mobile')"
    >
      <span
        class="material-icons h-12 w-12 p-2 mb-5 bg-green-400 rounded-xl text-black text-3xl flex items-center justify-center"
        >smartphone</span
      >
      <div>{{ t("mobile") | transloco }}</div>
    </div>
    <div
      class="grid-cols-1 mx-5 my-3 lg:my-0 lg:mx-2 p-10 font-medium text-black hover:text-green-600 bg-gray-300 hover:bg-white rounded-xl hover:shadow-2xl shadow-gray-700 hover:scale-110 transition-all duration-500 cursor-pointer"
      (click)="goToProjects('bigdata')"
    >
      <span
        class="material-icons h-12 w-12 p-2 mb-5 bg-green-400 rounded-xl text-black text-3xl flex items-center justify-center"
        >bar_chart</span
      >
      <div>{{ t("bigdata") | transloco }}</div>
    </div>
    <div
      class="grid-cols-1 mx-5 my-3 lg:my-0 lg:mx-2 p-10 font-medium text-black hover:text-green-600 bg-gray-300 hover:bg-white rounded-xl hover:shadow-2xl shadow-gray-700 hover:scale-110 transition-all duration-500 cursor-pointer"
      (click)="goToProjects('ai')"
    >
      <span
        class="material-icons h-12 w-12 p-2 mb-5 bg-green-400 rounded-xl text-black text-3xl flex items-center justify-center"
        >psychology</span
      >
      <div>{{ t("ai") | transloco }}</div>
    </div>
    <div
      class="grid-cols-2 mx-5 my-3 lg:my-0 lg:mx-2 p-10 font-medium text-white hover:text-green-600 bg-black rounded-xl hover:shadow-lg shadow-gray-700 hover:scale-110 transition-all duration-500"
    >
      <h3 class="text-green-600">{{ t("hello") | transloco }}</h3>
      <a href="mailto:ampr2003@gmail.com">
        ampr2003&#64;gmail.com
        <span
          class="material-icons px-2 text-green-600"
          style="
            transform: rotate(45deg);
            display: inline-block;
            vertical-align: middle;
          "
          >arrow_upward</span
        >
      </a>
    </div>
  </div>
</section>
